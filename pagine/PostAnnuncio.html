<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PostAnnuncio</title>
<link rel="stylesheet" href="../design-system/tokens.css">
<link rel="stylesheet" href="campagna.css">
<style>
.an{background:var(--rosso);color:var(--panna)}
.an .finestra{left:var(--casella);top:var(--casella);width:810px;height:675px;background:var(--panna);align-items:flex-end}
.an .finestra img{width:560px;display:block;margin-bottom:-4px}
.an .testo{left:var(--mezza);top:846px;width:945px}
.an .frase{margin-top:20px}
.an .info{left:var(--mezza);bottom:52px}
</style>
</head>
<body>
<div class="foglio">
<div class="cornice"><div class="post an">
  <div class="abs arco finestra"><img src="../design-system/illustrazioni/albero.svg" alt="Albero di Natale"></div>
  <div class="abs testo">
    <h1><img src="../design-system/marchio/marchio-panna.svg" alt="Motta a Natale" style="width:500px;display:block"></h1>
    <p class="frase">Eventi e intrattenimento per tutta la famiglia.</p>
  </div>
  <p class="abs info">Dal 5 dicembre al 6 gennaio</p>
</div></div>
<p class="didascalia">Post di annuncio 1080×1350 · l'albero nell'arco, il marchio in grande, la frase, le date. Nient'altro: il programma arriva nei post successivi.</p>
</div>
</body>
</html>
